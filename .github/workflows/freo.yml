name: Run freo on PR tag label

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  freo-on-pr:
    name: freo (label ${{ github.event.label.name }})
    if: >-
      github.event.label.name == 'freo' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      # Use the published freo composite action.
      - name: Run freo via published action
        uses: berkaybilik/freo@v1.0.0
        with:
          config: freo.json

      - name: Commit and push changes (if any)
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(freo): apply changes"
            git push origin "HEAD:${PR_BRANCH}"
          else
            echo "No changes to commit."
          fi


