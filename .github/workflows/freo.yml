name: Run freo on PR tag label

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  freo-on-pr:
    name: freo (label ${{ github.event.label.name }})
    if: github.event.label.name == 'freo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      # Use the published freo composite action.
      - name: Run freo via published action
        uses: berkaybilik/freo@v0.0.6

      - name: Commit and push changes (if any)
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(freo): apply changes"
            git push origin "HEAD:${PR_BRANCH}"
          else
            echo "No changes to commit."
          fi


