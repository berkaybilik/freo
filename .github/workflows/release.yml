name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, including the leading v (e.g. v1.1.0)"
        required: true
        type: string

permissions: {}

jobs:
  preflight:
    name: Validate release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version format, Cargo.toml agreement, and tag availability
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # The publish job commits dist/ to main, so the build must have come
          # from main too — otherwise we would ship binaries built from code
          # that is not on the branch we are tagging.
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Releases must be run from main, got '${GITHUB_REF_NAME}'."
            exit 1
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3, got '${VERSION}'."
            exit 1
          fi

          # Read `version` from the [package] section only, so a dependency
          # version can never be picked up by mistake.
          CARGO_VERSION="$(
            sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
              | sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' \
              | head -1
          )"

          if [[ "v${CARGO_VERSION}" != "${VERSION}" ]]; then
            echo "::error::Cargo.toml is at ${CARGO_VERSION} but you asked to release ${VERSION}. Bump Cargo.toml first."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} already exists. Releases are immutable; pick a new version."
            exit 1
          fi

          echo "OK: releasing ${VERSION}"

  ci:
    name: CI
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: ci
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          cp "target/${{ matrix.target }}/release/freo" staged/freo
          strip staged/freo || echo "strip unavailable or failed; shipping unstripped binary"

      - name: Upload binary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: freo-${{ matrix.target }}
          path: staged/freo
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Commit, attest, tag, and release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      attestations: write
      id-token: write # required by attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the exact commit that was built and tested, not whatever
          # main points at now. The push below is a fast-forward onto main and
          # will fail loudly if someone pushed in the meantime.
          ref: ${{ github.sha }}
          # This job is the one that pushes, so it keeps its credentials.
          persist-credentials: true

      - name: Download built binaries
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: freo-*
          path: incoming

      - name: Assemble dist/
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          for dir in incoming/freo-*; do
            target="${dir#incoming/freo-}"
            mkdir -p "dist/${target}"
            cp "${dir}/freo" "dist/${target}/freo"
            # upload-artifact does not preserve the executable bit, so restore
            # it here. git records mode 100755 and consumers get it back.
            chmod +x "dist/${target}/freo"
          done

          rm -rf incoming
          ls -l dist/*/freo

      - name: Package tarballs for the release page
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for dir in dist/*/; do
            target="$(basename "${dir}")"
            pkgdir="freo-${VERSION}-${target}"
            mkdir -p "${pkgdir}"
            cp "dist/${target}/freo" "${pkgdir}/freo"
            tar -czf "artifacts/${pkgdir}.tar.gz" "${pkgdir}"
            rm -rf "${pkgdir}"
          done
          ls -l artifacts

      # Both subjects matter: the composite action verifies dist/, while anyone
      # downloading by hand checks the tarball.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@62fc1d596301d0ab9914e1fec14dc5c8d93f65cd # v3.2.0
        with:
          subject-path: |
            dist/*/freo
            artifacts/*.tar.gz

      - name: Commit dist/ and create the tag
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f dist
          if git diff --cached --quiet; then
            echo "dist/ is unchanged; tagging the existing commit."
          else
            git commit -m "release: ${VERSION}"
            git push origin HEAD:main
          fi

          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin "refs/tags/${VERSION}"

          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No artifacts to release."
            exit 1
          fi
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Pin this release by commit SHA:"
            echo
            echo '```yaml'
            echo "- uses: berkaybilik/freo@${RELEASE_SHA} # ${VERSION}"
            echo '```'
          } > "${NOTES_FILE}"

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --verify-tag \
            --notes-file "${NOTES_FILE}" \
            "${files[@]}"
