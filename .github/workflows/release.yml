name: Build and Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  audit_and_test:
    name: Audit and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: cargo audit
        run: cargo audit --deny warnings

      - name: test
        run: cargo test --all --locked

  build:
    name: Build ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: audit_and_test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x86_64)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # macOS (x86_64 and arm64)
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # freo-<tag>-<target>.(tar.gz|zip)
      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="freo"
          VERSION="${GITHUB_REF_NAME}" # e.g. v1.2.3
          TGT="${{ matrix.target }}"
          OUTDIR="target/${TGT}/release"
          PKGDIR="${BIN_NAME}-${VERSION}-${TGT}"
          mkdir -p "${PKGDIR}"
          cp "${OUTDIR}/${BIN_NAME}" "${PKGDIR}/"
          tar -czf "${PKGDIR}.tar.gz" "${PKGDIR}"
          echo "asset=${PKGDIR}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pkg.outputs.asset }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: ${{ steps.pkg.outputs.asset }}
          retention-days: 1

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: freo-*
          path: artifacts
          merge-multiple: true

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(artifacts/**/*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No artifacts found to release."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes "" \
            "${files[@]}"