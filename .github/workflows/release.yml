name: Build and Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x86_64)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # macOS (x86_64 and arm64)
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # freo-<tag>-<target>.(tar.gz|zip)
      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="freo"
          VERSION="${GITHUB_REF_NAME}" # e.g. v1.2.3
          TGT="${{ matrix.target }}"
          OUTDIR="target/${TGT}/release"
          PKGDIR="${BIN_NAME}-${VERSION}-${TGT}"
          mkdir -p "${PKGDIR}"
          cp "${OUTDIR}/${BIN_NAME}" "${PKGDIR}/"
          tar -czf "${PKGDIR}.tar.gz" "${PKGDIR}"
          echo "asset=${PKGDIR}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Attest artifact provenance
        uses: actions/attest@v1
        with:
          subject-path: ${{ steps.pkg.outputs.asset }}

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes "" \
            "${{ steps.pkg.outputs.asset }}"