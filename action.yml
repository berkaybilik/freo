name: "freo - for the reviewers eyes only"
description: "Run freo"
inputs:
  config:
    description: "Optional path to a freo configuration file"
    required: false
runs:
  using: "composite"
  steps:
    - name: Detect changed files
      id: diff
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin "${GITHUB_BASE_REF}"
        DIFF_BASE="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"

        mapfile -t CHANGED_FILES < <(git diff --name-only --diff-filter=AM "${DIFF_BASE}" HEAD)

        if [[ "${#CHANGED_FILES[@]}" -eq 0 ]]; then
          echo "No added or modified files detected."
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        CHANGED_FILES_PATH="${RUNNER_TEMP}/freo-changed-files.txt"
        printf '%s\n' "${CHANGED_FILES[@]}" > "${CHANGED_FILES_PATH}"
        echo "CHANGED_FILES_PATH=${CHANGED_FILES_PATH}" >> "$GITHUB_ENV"
        echo "Detected ${#CHANGED_FILES[@]} file(s) to lint."
        echo "has_changes=true" >> "$GITHUB_OUTPUT"

    - name: No changed files
      if: ${{ steps.diff.outputs.has_changes == 'false' }}
      shell: bash
      run: echo "No changed files detected; skipping freo."

    - name: Download & install freo
      if: ${{ steps.diff.outputs.has_changes == 'true' }}
      id: install
      shell: bash
      env:
        VERSION: ${{ github.action_ref }}
        REPO: berkaybilik/freo
      run: |
        set -euo pipefail

        # Detect OS/arch to choose the right asset
        case "${RUNNER_OS}" in
          Linux)   OS_TRIPLE="unknown-linux-gnu" ;;
          macOS)   OS_TRIPLE="apple-darwin" ;;
          *) echo "Unsupported OS: ${RUNNER_OS}. Only Linux and macOS are supported."; exit 1 ;;
        esac

        case "${RUNNER_ARCH}" in
          X64)   ARCH="x86_64" ;;
          ARM64) ARCH="aarch64" ;;
          *) echo "Unsupported ARCH: ${RUNNER_ARCH}"; exit 1 ;;
        esac

        TARGET="${ARCH}-${OS_TRIPLE}"
        BASENAME="freo-${VERSION}-${TARGET}"
        ASSET="${BASENAME}.tar.gz"
        WORK_DIR="$(mktemp -d "${RUNNER_TEMP}/freo.XXXXXX")"
        ASSET_PATH="${WORK_DIR}/${ASSET}"

        if [[ -z "${VERSION:-}" ]]; then
          echo "VERSION could not be determined. Invoke this action via a tag, e.g., uses: berkaybilik/freo@v1.2.3."
          exit 1
        fi

        DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}"

        echo "Downloading ${ASSET} from ${DOWNLOAD_URL}"
        if ! curl -sSfL -o "${ASSET_PATH}" "${DOWNLOAD_URL}"; then
          echo "Failed to download ${ASSET} from ${DOWNLOAD_URL}"
          exit 1
        fi

        tar -xzf "${ASSET_PATH}" -C "${WORK_DIR}"
        EXTRACT_DIR="${WORK_DIR}/${BASENAME}"
        FREO_BIN="${EXTRACT_DIR}/freo"
        echo "FREO_BIN=${FREO_BIN}" >> "$GITHUB_ENV"

    - name: Run freo on added/modified files
      if: ${{ steps.diff.outputs.has_changes == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t CHANGED_FILES < "${CHANGED_FILES_PATH}"
        CONFIG_PATH="${{ inputs.config }}"
        CONFIG_ARGS=()
        if [[ -n "${CONFIG_PATH}" ]]; then
          CONFIG_ARGS=(-c "${CONFIG_PATH}")
        fi
        echo "Running: ${FREO_BIN} ${CONFIG_ARGS[*]} -f ${CHANGED_FILES[*]}"
        "${FREO_BIN}" "${CONFIG_ARGS[@]}" -f "${CHANGED_FILES[@]}"
