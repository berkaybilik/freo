name: "freo linter"
description: "Run freo on changed files only"
inputs:
  version:
    description: "Release tag of freo to download (e.g., v1.2.3 or v1)"
    required: true
  repo:
    description: "Owner/repo where freo releases live (e.g., your-org/freo)"
    required: true
  extra_args:
    description: "Extra CLI flags for freo (optional)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5

    - name: Detect changed files
      id: cf
      uses: tj-actions/changed-files@v47
      with:
        escape_json: false

    - name: No changed files
      if: ${{ steps.cf.outputs.added_files_count == '0' && steps.cf.outputs.modified_files_count == '0' }}
      shell: bash
      run: echo "No changed files detected; skipping freo."

    - name: Download & install freo
      if: ${{ steps.cf.outputs.added_files_count != '0' || steps.cf.outputs.modified_files_count != '0' }}
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail

        # Detect OS/arch to choose the right asset
        case "${RUNNER_OS}" in
          Linux)   OS_TRIPLE="unknown-linux-gnu" ;;
          macOS)   OS_TRIPLE="apple-darwin" ;;
          *) echo "Unsupported OS: ${RUNNER_OS}. Only Linux and macOS are supported."; exit 1 ;;
        esac

        case "${RUNNER_ARCH}" in
          X64)   ARCH="x86_64" ;;
          ARM64) ARCH="aarch64" ;;
          *) echo "Unsupported ARCH: ${RUNNER_ARCH}"; exit 1 ;;
        esac

        TARGET="${ARCH}-${OS_TRIPLE}"
        BASENAME="freo-${VERSION}-${TARGET}"
        ASSET="${BASENAME}.tar.gz"
        
        curl -sSL -o "${ASSET}" "https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}"
        
        tar -xzf "${ASSET}"
        EXTRACT_DIR="${BASENAME}"
        mkdir -p "${HOME}/.local/bin"
        mv "${EXTRACT_DIR}/freo" "${HOME}/.local/bin/"
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

    - name: Run freo on added/modified files
      if: ${{ steps.cf.outputs.added_files_count != '0' || steps.cf.outputs.modified_files_count != '0' }}
      shell: bash
      env:
        ADDED_JSON: ${{ steps.cf.outputs.added_files_json }}
        MODIFIED_JSON: ${{ steps.cf.outputs.modified_files_json }}
        EXTRA_ARGS: ${{ inputs.extra_args }}
      run: |
        set -euo pipefail
        echo "Running: freo ${EXTRA_ARGS} --changed-files-json \"${ADDED_JSON}\" --changed-files-json \"${MODIFIED_JSON}\""
        freo ${EXTRA_ARGS} --changed-files-json "${ADDED_JSON}" --changed-files-json "${MODIFIED_JSON}"
