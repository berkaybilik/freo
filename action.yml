name: "freo linter"
description: "Run freo on changed files only"
inputs:
  version:
    description: "Release tag of freo to download (e.g., v1.2.3 or v1)"
    required: true
  repo:
    description: "Owner/repo where freo releases live (e.g., your-org/freo)"
    required: true
runs:
  using: "composite"
  steps:
    - name: Detect changed files
      id: diff
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin "${GITHUB_BASE_REF}"
        DIFF_BASE="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"

        mapfile -t CHANGED_FILES < <(git diff --name-only --diff-filter=AM "${DIFF_BASE}" HEAD)

        if [[ "${#CHANGED_FILES[@]}" -eq 0 ]]; then
          echo "No added or modified files detected."
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        printf '%s\n' "${CHANGED_FILES[@]}" > changed-files.txt
        echo "Detected ${#CHANGED_FILES[@]} file(s) to lint."
        echo "has_changes=true" >> "$GITHUB_OUTPUT"

    - name: No changed files
      if: ${{ steps.diff.outputs.has_changes == 'false' }}
      shell: bash
      run: echo "No changed files detected; skipping freo."

    - name: Download & install freo
      if: ${{ steps.diff.outputs.has_changes == 'true' }}
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail

        # Detect OS/arch to choose the right asset
        case "${RUNNER_OS}" in
          Linux)   OS_TRIPLE="unknown-linux-gnu" ;;
          macOS)   OS_TRIPLE="apple-darwin" ;;
          *) echo "Unsupported OS: ${RUNNER_OS}. Only Linux and macOS are supported."; exit 1 ;;
        esac

        case "${RUNNER_ARCH}" in
          X64)   ARCH="x86_64" ;;
          ARM64) ARCH="aarch64" ;;
          *) echo "Unsupported ARCH: ${RUNNER_ARCH}"; exit 1 ;;
        esac

        TARGET="${ARCH}-${OS_TRIPLE}"
        BASENAME="freo-${VERSION}-${TARGET}"
        ASSET="${BASENAME}.tar.gz"
        
        curl -sSL -o "${ASSET}" "https://github.com/${REPO}/releases/download/${VERSION}/${ASSET}"
        
        tar -xzf "${ASSET}"
        EXTRACT_DIR="${BASENAME}"
        mkdir -p "${HOME}/.local/bin"
        mv "${EXTRACT_DIR}/freo" "${HOME}/.local/bin/"
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

    - name: Run freo on added/modified files
      if: ${{ steps.diff.outputs.has_changes == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t CHANGED_FILES < changed-files.txt
        echo "Running: freo -f ${CHANGED_FILES[*]}"
        freo -f "${CHANGED_FILES[@]}"
