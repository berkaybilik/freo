name: "freo - for the reviewers eyes only"
description: "Strip comments that are meant For the Reviewers' Eyes Only."
branding:
  icon: "eye-off"
  color: "green"
inputs:
  config:
    description: "Optional path to a freo configuration file"
    required: false
runs:
  using: "composite"
  steps:
    - name: Detect changed files
      id: diff
      shell: bash
      env:
        PR_BASE: ${{ github.event.pull_request.base.ref }}
        ENV_BASE: ${{ github.base_ref }}
      run: |
        set -euo pipefail

        TARGET_BRANCH="${PR_BASE:-$ENV_BASE}"

        if [[ -z "${TARGET_BRANCH}" ]]; then
          echo "::error::Could not determine the base branch. Ensure this action runs on a pull_request, pull_request_review, or pull_request_target event."
          exit 1
        fi

        echo "Detected target branch: ${TARGET_BRANCH}"

        git fetch --no-tags origin "${TARGET_BRANCH}"

        DIFF_BASE="$(git merge-base HEAD "origin/${TARGET_BRANCH}")"

        mapfile -t CHANGED_FILES < <(git diff --name-only --diff-filter=AM "${DIFF_BASE}" HEAD)

        if [[ "${#CHANGED_FILES[@]}" -eq 0 ]]; then
          echo "No added or modified files detected."
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        CHANGED_FILES_PATH="${RUNNER_TEMP}/freo-changed-files.txt"
        printf '%s\n' "${CHANGED_FILES[@]}" > "${CHANGED_FILES_PATH}"

        echo "CHANGED_FILES_PATH=${CHANGED_FILES_PATH}" >> "$GITHUB_ENV"
        echo "Detected ${#CHANGED_FILES[@]} file(s) to lint."
        echo "has_changes=true" >> "$GITHUB_OUTPUT"

    - name: No changed files
      if: ${{ steps.diff.outputs.has_changes == 'false' }}
      shell: bash
      run: echo "No changed files detected; skipping freo."

    - name: Resolve platform binary
      if: ${{ steps.diff.outputs.has_changes == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        case "${RUNNER_OS}" in
          Linux) OS_TRIPLE="unknown-linux-gnu" ;;
          macOS) OS_TRIPLE="apple-darwin" ;;
          *) echo "::error::Unsupported OS: ${RUNNER_OS}. Only Linux and macOS are supported."; exit 1 ;;
        esac

        case "${RUNNER_ARCH}" in
          X64)   ARCH="x86_64" ;;
          ARM64) ARCH="aarch64" ;;
          *) echo "::error::Unsupported ARCH: ${RUNNER_ARCH}"; exit 1 ;;
        esac

        TARGET="${ARCH}-${OS_TRIPLE}"
        DIST_DIR="${GITHUB_ACTION_PATH}/dist"
        FREO_BIN="${DIST_DIR}/${TARGET}/freo"

        if [[ ! -d "${DIST_DIR}" ]]; then
          echo "::error::This ref has no dist/ directory. Before v1.1.0 the binary lived on the release page instead; pin the SHA printed on a v1.1.0-or-later release."
          exit 1
        fi

        if [[ ! -f "${FREO_BIN}" ]]; then
          echo "::error::No prebuilt freo binary for ${TARGET} at ${FREO_BIN}."
          echo "::error::Prebuilt targets in this ref: $(cd "${DIST_DIR}" && printf '%s ' */ | tr -d '/')"
          exit 1
        fi

        # git stores mode 100755, but restore the bit defensively in case the
        # action was materialised through something that dropped it.
        chmod +x "${FREO_BIN}"

        echo "FREO_BIN=${FREO_BIN}" >> "$GITHUB_ENV"
        echo "Resolved ${FREO_BIN}"

    - name: Verify artifact attestation
      if: ${{ steps.diff.outputs.has_changes == 'true' }}
      shell: bash
      env:
        REPO: berkaybilik/freo
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ -z "${GH_TOKEN:-}" ]]; then
          echo "::error::GH_TOKEN is not set; cannot verify the binary's attestation."
          exit 1
        fi
        gh attestation verify "${FREO_BIN}" \
          -R "${REPO}" \
          --signer-workflow "${REPO}/.github/workflows/release.yml"

    - name: Check for version skew
      if: ${{ steps.diff.outputs.has_changes == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        # Every `|| true` here is load-bearing. Under `set -e` with pipefail a
        # command substitution takes the pipeline's exit status, so a binary
        # that cannot run --version (one built before the flag existed, or one
        # that will not exec at all) would abort the step with no diagnostic
        # and make the fallbacks below unreachable.
        DECLARED="$(
          sed -n '/^\[package\]/,/^\[/p' "${GITHUB_ACTION_PATH}/Cargo.toml" \
            | sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' \
            | head -1 || true
        )"
        SHIPPED="$("${FREO_BIN}" --version 2>/dev/null | awk '{print $2}' || true)"

        if [[ -z "${SHIPPED}" ]]; then
          echo "::warning::Could not read a version out of ${FREO_BIN}; skipping the skew check."
        elif [[ -n "${DECLARED}" && "${DECLARED}" != "${SHIPPED}" ]]; then
          MSG="freo version skew: this tree declares ${DECLARED} but dist/ ships ${SHIPPED}. You have pinned a commit that is not a release; pin the SHA printed on the release page instead."
          # A local `uses: ./` is this repo dogfooding itself, where the skew is
          # expected between a version bump and the release that follows it.
          if [[ "${GITHUB_ACTION_PATH}" == "${GITHUB_WORKSPACE}"* ]]; then
            echo "::warning::${MSG}"
          else
            echo "::error::${MSG}"
            exit 1
          fi
        fi

        echo "Using ${FREO_BIN} (freo ${SHIPPED:-unknown})"

    - name: Run freo on added/modified files
      if: ${{ steps.diff.outputs.has_changes == 'true' }}
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        mapfile -t CHANGED_FILES < "${CHANGED_FILES_PATH}"

        CONFIG_ARGS=()
        if [[ -n "${INPUT_CONFIG}" ]]; then
          CONFIG_ARGS=(-c "${INPUT_CONFIG}")
        fi

        echo "Running: ${FREO_BIN} ${CONFIG_ARGS[*]} -f [file list]"
        "${FREO_BIN}" "${CONFIG_ARGS[@]}" -f "${CHANGED_FILES[@]}"
